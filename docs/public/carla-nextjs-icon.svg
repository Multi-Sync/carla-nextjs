<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#6366f1" opacity="0.1"/>
  <circle cx="200" cy="200" r="160" fill="white" stroke="#6366f1" stroke-width="3"/>

  <!-- Center circle with "C" for Carla -->
  <circle cx="200" cy="200" r="50" fill="#6366f1"/>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">C</text>

  <!-- Top-left: Customer Support (chat bubble) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="35" fill="#10b981" opacity="0.2"/>
    <path d="M-15,-10 L15,-10 L15,10 L5,10 L0,15 L-5,10 L-15,10 Z" fill="#10b981" stroke="#10b981" stroke-width="2"/>
    <circle cx="-8" cy="0" r="2" fill="white"/>
    <circle cx="0" cy="0" r="2" fill="white"/>
    <circle cx="8" cy="0" r="2" fill="white"/>
  </g>

  <!-- Top-right: Analytics (bar chart) -->
  <g transform="translate(280, 120)">
    <circle cx="0" cy="0" r="35" fill="#8b5cf6" opacity="0.2"/>
    <rect x="-15" y="5" width="8" height="10" fill="#8b5cf6" rx="1"/>
    <rect x="-5" y="-5" width="8" height="20" fill="#8b5cf6" rx="1"/>
    <rect x="5" y="-10" width="8" height="25" fill="#8b5cf6" rx="1"/>
  </g>

  <!-- Bottom-left: Performance (speedometer) -->
  <g transform="translate(120, 280)">
    <circle cx="0" cy="0" r="35" fill="#f59e0b" opacity="0.2"/>
    <path d="M-12,5 A15,15 0 1,1 12,5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="8" y2="-8" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="3" fill="#f59e0b"/>
  </g>

  <!-- Bottom-right: Bug Fix (wrench + checkmark) -->
  <g transform="translate(280, 280)">
    <circle cx="0" cy="0" r="35" fill="#ef4444" opacity="0.2"/>
    <path d="M-8,-12 L-8,-2 L-4,2 L-4,12 L4,12 L4,2 L8,-2 L8,-12 L4,-12 L4,-8 L-4,-8 L-4,-12 Z" fill="#ef4444"/>
    <circle cx="10" cy="-10" r="8" fill="#10b981"/>
    <path d="M7,-10 L9,-8 L13,-13" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connecting lines (optional, subtle) -->
  <line x1="150" y1="150" x2="175" y2="175" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="150" x2="225" y2="175" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="250" x2="175" y2="225" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="225" y2="225" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
</svg>
